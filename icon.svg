<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="soft-shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.12"/>
    </filter>
    <filter id="inner-glow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="pot-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EEF1F4"/>
    </linearGradient>
    <linearGradient id="flame-grad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#E8622A"/>
    </linearGradient>
  </defs>

  <!-- ── Background ── -->
  <rect width="512" height="512" rx="115" fill="#EDEDEB"/>

  <!-- ── Thought bubble connecting dots ── -->
  <circle cx="175" cy="310" r="13" fill="white" opacity="0.93"/>
  <circle cx="158" cy="332" r="8"  fill="white" opacity="0.93"/>
  <circle cx="148" cy="349" r="5"  fill="white" opacity="0.93"/>

  <!-- ── Thought bubble main oval ── -->
  <ellipse cx="242" cy="192" rx="150" ry="105" fill="white" opacity="0.93" filter="url(#soft-shadow)"/>

  <!-- ── Open notebook inside bubble ── -->
  <!-- Left page -->
  <rect x="110" y="135" width="66" height="86" rx="3" fill="#D4E4F0" opacity="0.65"/>
  <!-- Right page -->
  <rect x="179" y="135" width="66" height="86" rx="3" fill="#D4E4F0" opacity="0.65"/>
  <!-- Spine -->
  <rect x="175" y="130" width="8" height="96" rx="4" fill="#8AACC0"/>

  <!-- Grid lines - left page -->
  <rect x="112" y="148" width="61" height="2" rx="1" fill="#8AACC0" opacity="0.45"/>
  <rect x="112" y="160" width="61" height="2" rx="1" fill="#8AACC0" opacity="0.45"/>
  <rect x="112" y="172" width="61" height="2" rx="1" fill="#8AACC0" opacity="0.45"/>
  <rect x="112" y="184" width="61" height="2" rx="1" fill="#8AACC0" opacity="0.45"/>
  <rect x="112" y="196" width="61" height="2" rx="1" fill="#8AACC0" opacity="0.45"/>
  <rect x="122" y="135" width="2" height="86" rx="1" fill="#8AACC0" opacity="0.45"/>
  <rect x="134" y="135" width="2" height="86" rx="1" fill="#8AACC0" opacity="0.45"/>
  <rect x="146" y="135" width="2" height="86" rx="1" fill="#8AACC0" opacity="0.45"/>
  <rect x="158" y="135" width="2" height="86" rx="1" fill="#8AACC0" opacity="0.45"/>
  <rect x="170" y="135" width="2" height="86" rx="1" fill="#8AACC0" opacity="0.45"/>

  <!-- Grid lines - right page -->
  <rect x="181" y="148" width="62" height="2" rx="1" fill="#8AACC0" opacity="0.45"/>
  <rect x="181" y="160" width="62" height="2" rx="1" fill="#8AACC0" opacity="0.45"/>
  <rect x="181" y="172" width="62" height="2" rx="1" fill="#8AACC0" opacity="0.45"/>
  <rect x="181" y="184" width="62" height="2" rx="1" fill="#8AACC0" opacity="0.45"/>
  <rect x="181" y="196" width="62" height="2" rx="1" fill="#8AACC0" opacity="0.45"/>
  <rect x="191" y="135" width="2" height="86" rx="1" fill="#8AACC0" opacity="0.45"/>
  <rect x="203" y="135" width="2" height="86" rx="1" fill="#8AACC0" opacity="0.45"/>
  <rect x="215" y="135" width="2" height="86" rx="1" fill="#8AACC0" opacity="0.45"/>
  <rect x="227" y="135" width="2" height="86" rx="1" fill="#8AACC0" opacity="0.45"/>
  <rect x="239" y="135" width="2" height="86" rx="1" fill="#8AACC0" opacity="0.45"/>

  <!-- Fork × knife icon - left page -->
  <line x1="129" y1="140" x2="129" y2="168" stroke="#8AACC0" stroke-width="3" stroke-linecap="round"/>
  <line x1="126" y1="140" x2="126" y2="150" stroke="#8AACC0" stroke-width="2" stroke-linecap="round"/>
  <line x1="132" y1="140" x2="132" y2="150" stroke="#8AACC0" stroke-width="2" stroke-linecap="round"/>
  <path d="M126 150 Q129 153 132 150" fill="none" stroke="#8AACC0" stroke-width="2"/>
  <!-- knife -->
  <line x1="142" y1="140" x2="142" y2="168" stroke="#8AACC0" stroke-width="3" stroke-linecap="round"/>
  <path d="M142 140 C146 142 148 148 142 152" fill="none" stroke="#8AACC0" stroke-width="2"/>

  <!-- Carrot icon - right page -->
  <g transform="translate(212,170) rotate(-20)">
    <path d="M0,-20 C8,-20 13,-12 13,0 C13,12 8,20 0,22 C-8,20 -13,12 -13,0 C-13,-12 -8,-20 0,-20 Z"
      fill="#8AACC0" opacity="0.65"/>
    <line x1="-5" y1="-22" x2="-7" y2="-15" stroke="#8AACC0" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0"  y1="-24" x2="0"  y2="-16" stroke="#8AACC0" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="5"  y1="-22" x2="7"  y2="-15" stroke="#8AACC0" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- ── Pencil (diagonal, overlapping right edge of bubble) ── -->
  <g transform="translate(328,115) rotate(-32)">
    <!-- Eraser cap -->
    <rect x="-11" y="-2"  width="22" height="14" rx="5" fill="#F4AAAA"/>
    <!-- Metal band -->
    <rect x="-11" y="12"  width="22" height="8"  fill="#C6D2DA"/>
    <!-- Body -->
    <rect x="-11" y="20"  width="22" height="92" fill="#D94535"/>
    <!-- Wood tip -->
    <polygon points="-11,112 11,112 0,132" fill="#F0D5A5"/>
    <!-- Graphite -->
    <polygon points="-4,120 4,120 0,132" fill="#555"/>
    <!-- Highlight strip -->
    <rect x="-7" y="22" width="4" height="86" rx="2" fill="rgba(255,255,255,0.22)"/>
  </g>

  <!-- ── Flame ── -->
  <path d="M197 453
    C178 434 173 413 189 397
    C185 418 207 410 200 389
    C214 407 226 402 220 381
    C236 400 246 419 240 442
    C251 420 256 407 252 386
    C268 409 262 432 274 453 Z"
    fill="url(#flame-grad)"/>
  <path d="M208 453
    C196 436 194 422 204 410
    C200 424 212 421 209 407
    C218 418 225 415 222 402
    C231 415 235 428 230 441
    C240 423 244 413 241 401
    C254 420 249 435 259 453 Z"
    fill="#F8C355" opacity="0.8"/>

  <!-- ── Saucepan ── -->
  <!-- Body -->
  <rect x="155" y="334" width="200" height="112" rx="16" fill="url(#pot-grad)" stroke="#B8C4CE" stroke-width="3.5" filter="url(#inner-glow)"/>
  <!-- Lid -->
  <ellipse cx="255" cy="334" rx="106" ry="19" fill="url(#pot-grad)" stroke="#B8C4CE" stroke-width="3.5"/>
  <!-- Lid knob -->
  <ellipse cx="255" cy="318" rx="17" ry="11" fill="url(#pot-grad)" stroke="#B8C4CE" stroke-width="3.5"/>
  <!-- Handle -->
  <path d="M355 352 Q410 342 420 359 Q426 372 410 377 L355 370 Z" fill="url(#pot-grad)" stroke="#B8C4CE" stroke-width="3.5"/>
  <!-- Gloss highlight -->
  <ellipse cx="197" cy="378" rx="16" ry="32" fill="rgba(255,255,255,0.55)" transform="rotate(-12,197,378)"/>

  <!-- ── Sparkle (bottom right) ── -->
  <path d="M452 434 L455 424 L458 434 L468 437 L458 440 L455 450 L452 440 L442 437 Z"
    fill="#C5C5C3" opacity="0.7"/>
</svg>
